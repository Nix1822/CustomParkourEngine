# anti-cheat limits
anticheat:
  max-horizontal-per-move: 0.95   # max horizontal blocks per move event
  max-vertical-per-move: 0.85     # max upward blocks per move event
  min-finish-time-ms: 3000        # finishing faster than this is rejected
  block-commands: true            # block commands while running
  allowed-commands: [parkour, pk]
void-y: 60                       # default fail Y-level for newly loaded courses; each course can override it
# Spec: stepping on a higher-indexed checkpoint updates progress (skipping allowed).
# Set to true to force players to reach the LAST checkpoint before the finish pad counts.
require-all-checkpoints: false
